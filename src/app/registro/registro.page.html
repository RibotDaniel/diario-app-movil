<ion-content [fullscreen]="true" class="registro-content">

  <div class="registro-container">

    <!-- Flecha para regresar -->
    <div class="back-container">
      <ion-button
        fill="clear"
        class="back-button"
        routerLink="/login">

        <ion-icon
          slot="icon-only"
          name="arrow-back-outline">
        </ion-icon>

      </ion-button>
    </div>

    <!-- Título -->
    <div class="encabezado">
      <h1>CREA TU CUENTA</h1>
      <p>Tu información siempre en resguardo</p>
    </div>

    <!-- Formulario -->
    <div class="formulario">

      <!-- Nombre -->
      <ion-input
        fill="outline"
        label="Nombre"
        labelPlacement="floating"
        type="text">
      </ion-input>

      <ion-input
        fill="outline"
        label="correo"
        labelPlacement="floating"
        type="email">
      </ion-input>

      <!-- Contraseña -->
      <ion-input
        fill="outline"
        label="Contraseña"
        labelPlacement="floating"
        type="password">

        <ion-input-password-toggle
          slot="end">
        </ion-input-password-toggle>

      </ion-input>

    </div>

    <!-- Imagen de perfil -->
    <div class="perfil-selector">

      <div class="avatar-container">
        <ion-icon
          name="person-outline"
          class="perfil-icon">
        </ion-icon>
      </div>

      <span>IMAGEN DE PERFIL</span>

    </div>

    <!-- Botón guardar -->
    <ion-button
      expand="block"
      class="guardar"
      routerLink="/tabs/inicio">
      Guardar
    </ion-button>
    <div class="login-link">
      <span>¿ya tienes cuenta?</span>
      <a routerLink="/login">inicia sesion</a>
    </div>

  </div>

</ion-content>
