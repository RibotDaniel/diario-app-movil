<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Recordatorio diario</ion-card-title>
      <ion-card-subtitle>{{ activas() ? 'Activado a las 20:00' : 'Apagado' }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      @if (activas()) {
        <ion-button expand="block" color="danger" (click)="apagar()">Apagar</ion-button>
      } @else {
        <ion-button expand="block" (click)="activar()">Activar</ion-button>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
