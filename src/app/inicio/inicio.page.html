<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="end">
      <ion-button aria-label="Notificaciones">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button aria-label="Perfil">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
      <ion-button aria-label="Configuración">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="main-container">
    
    <div class="greeting-section">
      <h1 class="title">Hola, usuario</h1>
      <p class="subtitle">¿Tienes pensado escribir algo el día de hoy?</p>
    </div>

    <ion-card class="entry-card">
      <ion-card-content class="card-content-layout">
        
        <div class="image-container">
          <img src="assets/Inicioimagen.gif" alt="Ilustración relajante" />
        </div>
        
        <div class="message-content">
          <p class="motivational-text">
            Tómate tu tiempo. Respira profundo, hoy estás haciendo un gran esfuerzo.
          </p>
          
        </div>

      </ion-card-content>
    </ion-card>

    <div class="suggested-content">
      <ion-icon name="close-outline" class="big-x-placeholder"></ion-icon>
      <div class="bottom-lines">
        <div class="line long"></div>
        <div class="line medium"></div>
      </div>
    </div>

  </div>
</ion-content>
