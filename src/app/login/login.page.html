<ion-content class="ion-padding" style="--background: #F5EBE0;">
  <div class="login-container">
    
    <!-- Encabezado con tipografía Nunito -->
    <div class="header-section">
      <h1 class="title">Hola de nuevo</h1>
      <p class="subtitle">Ingresa para tu momento de reflexión</p>
    </div>

    <!-- Formulario con inputs redondeados -->
    <div class="form-section">
      <ion-input
        label="Correo electrónico"
        labelPlacement="floating"
        fill="outline"
        placeholder="ejemplo@correo.com"
        type="email"
        [(ngModel)]="correo">
      </ion-input>

      <ion-input
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        type="password"
        [(ngModel)]="contrasena">
        <!-- Ícono para mostrar/ocultar contraseña según la guía -->
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </div>

    <!-- Botones de Acción -->
    <div class="actions-section">
      <!-- Botón principal Verde Salvia (conectado a la función de autenticación) -->
      <ion-button expand="block" class="btn-primary" (click)="entrar()">
        Entrar
      </ion-button>
    </div>

    <!-- Enlace de registro Arena Oscura -->
   <div class="footer-section">
      <ion-button expand="block" fill="clear" class="btn-link-arena" routerLink="/registro">
        ¿No tienes perfil? Créalo aquí
      </ion-button>
    </div>

  </div>
</ion-content>
