<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Editar perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #F5EBE0;">
  <div class="edit-profile-container" style="max-width: 400px; margin: auto; text-align: center; padding-top: 20px;">
    
    <h1 style="font-family: 'Nunito', sans-serif; font-weight: bold; margin-bottom: 20px;">Editar perfil</h1>

    <!-- Avatar / Foto de perfil con opción de abrir la cámara -->
    <div class="avatar-section" style="margin-bottom: 25px;">
      <div (click)="tomarFoto()" style="width: 100px; height: 100px; margin: auto; background: #e0d5c9; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; border: 2px dashed #8c7a6b;">
        <img *ngIf="imagenPerfil" [src]="imagenPerfil" style="width: 100%; height: 100%; object-fit: cover;" />
        <ion-icon *ngIf="!imagenPerfil" name="camera-outline" style="font-size: 32px; color: #6c5d53;"></ion-icon>
      </div>
      <p style="font-size: 12px; color: #6c5d53; margin-top: 8px;">Toca para cambiar foto</p>
    </div>

    <!-- Formulario simplificado (Nombre de usuario) -->
    <div class="form-section" style="margin-bottom: 25px; text-align: left;">
      <ion-input
        label="Nombre de usuario"
        labelPlacement="floating"
        fill="outline"
        placeholder="Tu nuevo nombre"
        type="text"
        [(ngModel)]="nombreUsuario">
      </ion-input>
    </div>

    <!-- Botón de confirmar -->
    <div class="actions-section">
      <ion-button expand="block" style="--background: #8ea89d;" (click)="guardarCambios()">
        Confirmar
      </ion-button>
    </div>

  </div>
</ion-content>
